# Postgres e Inngest de desenvolvimento.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dc_owner
      POSTGRES_PASSWORD: dc_owner
      POSTGRES_DB: decreta
    ports:
      # Outra porta, se a 5433 já for de outro Postgres: DECRETA_PG_PORTA=5434 docker compose up -d
      - "${DECRETA_PG_PORTA:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  # Dev server do Inngest: descobre as funções em /api/inngest da API local.
  # Painel em http://localhost:8288.
  inngest:
    image: inngest/inngest:v1.46.0
    command: inngest dev -u http://host.docker.internal:8787/api/inngest --no-discovery
    ports:
      - "8288:8288"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  pgdata:
