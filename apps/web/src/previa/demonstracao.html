<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Escritório de exemplo · Decreta</title>
    <meta name="description" content="O Decreta por dentro, sem cadastro: um escritório de exemplo, com dados fictícios e respostas da IA simuladas." />
    <link rel="canonical" href="https://decreta.site/demonstracao" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1d1d20" />
    <style>
      html, body { height: 100%; margin: 0; background: #1d1d20; }
      body { display: flex; flex-direction: column; font: 500 13px/18px ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #efece4; }
      .faixa { display: flex; flex: none; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 16px; padding: 6px 16px; }

      .faixa nav { display: flex; gap: 16px; }
      .faixa a { color: inherit; text-underline-offset: 3px; white-space: nowrap; }
      .faixa a:focus-visible { outline: 2px solid #efece4; outline-offset: 2px; border-radius: 2px; }
      iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: #fbfaf7; }
    </style>
  </head>
  <body>
    <div class="faixa" role="note">
      <p>Escritório de exemplo, com dados fictícios. As respostas da IA são simuladas.</p>
      <nav aria-label="Sair do exemplo"><a href="/cadastro">Criar conta</a><a href="/">Voltar ao site</a></nav>
    </div>
    <iframe src="/demonstracao/app.html" title="O Decreta com um escritório de exemplo"></iframe>

</html>
